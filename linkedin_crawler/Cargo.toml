[package]
name = "linkedin_crawler"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP client com rustls (sem dependência de OpenSSL do sistema)
reqwest = { version = "0.11", default-features = false, features = ["cookies", "json", "rustls-tls"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTML parsing
scraper = "0.18"

# SQLite
rusqlite = { version = "0.30", features = ["bundled"] }

# Serialização
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Delays aleatórios para evitar bloqueio
rand = "0.8"

# Tratamento de erros
anyhow = "1"
thiserror = "1"

# URL encoding
urlencoding = "2"
